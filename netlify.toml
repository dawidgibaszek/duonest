[build]
  command = "npm run build"
  publish = "dist"

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 3000
  autoLaunch = false

[build.environment]
  NODE_VERSION = "22"
  NITRO_PRESET = "netlify"
  SECRETS_SCAN_ENABLED = "true"

[functions]
  directory = "netlify/functions"

# API Redirects for Serverless Functions (placed before SPA catch-all)
[[redirects]]
  from = "/api/movies/search"
  to = "/.netlify/functions/movies-search"
  status = 200

[[redirects]]
  from = "/api/movies/trending"
  to = "/.netlify/functions/movies-trending"
  status = 200

[[redirects]]
  from = "/api/movies/random"
  to = "/.netlify/functions/movies-random"
  status = 200

[[redirects]]
  from = "/api/wishlist/preview"
  to = "/.netlify/functions/wishlist-preview"
  status = 200

[[redirects]]
  from = "/api/meals/search"
  to = "/.netlify/functions/meals-search"
  status = 200

[[redirects]]
  from = "/api/meals/lookup"
  to = "/.netlify/functions/meals-lookup"
  status = 200

[[redirects]]
  from = "/api/meals/categories"
  to = "/.netlify/functions/meals-categories"
  status = 200

[[redirects]]
  from = "/api/meals/import"
  to = "/.netlify/functions/meals-import"
  status = 200

[[redirects]]
  from = "/api/calendar/feed"
  to = "/.netlify/functions/calendar-feed"
  status = 200

# API Redirects for Web Push Notifications
[[redirects]]
  from = "/api/push/send"
  to = "/.netlify/functions/push-send"
  status = 200

[[redirects]]
  from = "/api/push/subscribe"
  to = "/.netlify/functions/push-subscribe"
  status = 200

[[redirects]]
  from = "/api/push/unsubscribe"
  to = "/.netlify/functions/push-unsubscribe"
  status = 200

[[redirects]]
  from = "/api/push/test"
  to = "/.netlify/functions/push-test"
  status = 200

# Spotify OAuth and playback API
[[redirects]]
  from = "/api/spotify/start"
  to = "/.netlify/functions/spotify-start"
  status = 200

[[redirects]]
  from = "/api/spotify/callback"
  to = "/.netlify/functions/spotify-callback"
  status = 200

[[redirects]]
  from = "/auth/spotify/callback"
  to = "/.netlify/functions/spotify-callback"
  status = 200

[[redirects]]
  from = "/api/spotify/playback"
  to = "/.netlify/functions/spotify-playback"
  status = 200

[[redirects]]
  from = "/api/spotify/status"
  to = "/.netlify/functions/spotify-status"
  status = 200

[[redirects]]
  from = "/api/spotify/current-playback"
  to = "/.netlify/functions/spotify-playback"
  status = 200

[[redirects]]
  from = "/api/spotify/disconnect"
  to = "/.netlify/functions/spotify-disconnect"
  status = 200

[[redirects]]
  from = "/api/spotify/visibility"
  to = "/.netlify/functions/spotify-visibility"
  status = 200

# Pass through Nuxt and Vite dev server assets (prevents SPA catch-all from intercepting Vite dev bundles)
[[redirects]]
  from = "/_nuxt/*"
  to = "/_nuxt/:splat"
  status = 200

[[redirects]]
  from = "/@vite/*"
  to = "/@vite/:splat"
  status = 200

[[redirects]]
  from = "/@fs/*"
  to = "/@fs/:splat"
  status = 200

[[redirects]]
  from = "/@id/*"
  to = "/@id/:splat"
  status = 200

[[redirects]]
  from = "/__vite_ping"
  to = "/__vite_ping"
  status = 200

# PWA & SPA Routing Fallback for Netlify
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache control for Service Worker, HTML, and Web Manifest
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw-push.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Cache control for static assets
[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
